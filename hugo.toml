baseURL = "https://pause-ai-freiburg.de/"
title = "PauseAI Freiburg"
defaultContentLanguage = "de"
defaultContentLanguageInSubdir = false
enableRobotsTXT = true
enableGitInfo = true
timeZone = "Europe/Berlin"

[module]
  [[module.imports]]
    path = "github.com/adityatelange/hugo-PaperMod"

[caches]
  [caches.images]
    dir = ":cacheDir/images"

[outputs]
  home = ["HTML", "RSS", "JSON"]

[params]
  env = "production"
  defaultTheme = "auto"
  mainSections = ["blog"]
  ShowBreadCrumbs = true
  ShowReadingTime = true
  ShowPostNavLinks = true
  ShowCodeCopyButtons = true
  ShowToc = false
  displayFullLangName = true
  disableSpecial1stPost = true

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/omarkohl/pause-ai-freiburg.de"

[languages]
  [languages.de]
    label = "Deutsch"
    locale = "de-DE"
    contentDir = "content/de"
    weight = 1
    copyright = "Inhalte unter [CC BY-SA 4.0](https://creativecommons.org/licenses/by-sa/4.0/deed.de), sofern nicht anders angegeben."
    [languages.de.params]
      description = "PauseAI Freiburg – Wir setzen uns für eine internationale Pause bei der Entwicklung der gefährlichsten KI-Systeme ein."
      [languages.de.params.editPost]
        URL = "https://github.com/omarkohl/pause-ai-freiburg.de/edit/main/content/de"
        appendFilePath = true
      [languages.de.params.homeInfoParams]
        Title = "PauseAI Freiburg"
        Content = """
Wir sind eine lokale Gruppe von [PauseAI](https://pauseai.info) in Freiburg im Breisgau.
Wir setzen uns für eine internationale Pause bei der Entwicklung der gefährlichsten KI-Systeme ein –
so lange, bis wir wissen, wie wir sie sicher bauen können.

**[Mitmachen](/mitmachen/)** · **[Termine](/termine/)**
"""

    [[languages.de.menus.main]]
      name = "Termine"
      pageRef = "/termine"
      weight = 10
    [[languages.de.menus.main]]
      name = "Blog"
      pageRef = "/blog"
      weight = 20
    [[languages.de.menus.main]]
      name = "Mitmachen"
      pageRef = "/mitmachen"
      weight = 40
    [[languages.de.menus.main]]
      name = "Suche"
      pageRef = "/suche"
      weight = 50

  [languages.en]
    label = "English"
    locale = "en-US"
    contentDir = "content/en"
    weight = 2
    copyright = "Content licensed under [CC BY-SA 4.0](https://creativecommons.org/licenses/by-sa/4.0/), unless otherwise marked."
    [languages.en.params]
      description = "PauseAI Freiburg – We campaign for an international pause on the development of the most dangerous AI systems."
      [languages.en.params.editPost]
        URL = "https://github.com/omarkohl/pause-ai-freiburg.de/edit/main/content/en"
        appendFilePath = true
      [languages.en.params.homeInfoParams]
        Title = "PauseAI Freiburg"
        Content = """
We are a local group of [PauseAI](https://pauseai.info) in Freiburg im Breisgau, Germany.
We campaign for an international pause on the development of the most dangerous AI systems –
until we know how to build them safely.

**[Get involved](/en/join/)** · **[Events](/en/events/)**
"""

    [[languages.en.menus.main]]
      name = "Events"
      pageRef = "/events"
      weight = 10
    [[languages.en.menus.main]]
      name = "Blog"
      pageRef = "/blog"
      weight = 20
    [[languages.en.menus.main]]
      name = "Get involved"
      pageRef = "/join"
      weight = 40
    [[languages.en.menus.main]]
      name = "Search"
      pageRef = "/search"
      weight = 50
