baseURL = "https://pause-ai-freiburg.de/"
title = "PauseAI Freiburg"
defaultContentLanguage = "de"
defaultContentLanguageInSubdir = false
enableRobotsTXT = true
enableGitInfo = true
timeZone = "Europe/Berlin"

[module]
  [[module.imports]]
    path = "github.com/imfing/hextra"

[caches]
  [caches.images]
    dir = ":cacheDir/images"

[outputs]
  home = ["HTML", "RSS"]

[markup]
  [markup.goldmark.renderer]
    unsafe = true # needed for the HTML in the Hextra landing page

[params]
  images = ["/images/og-image.png"] # social share preview (1200x675)
  [params.navbar]
    displayTitle = true
    displayLogo = false
  [params.page]
    width = "normal"
  [params.theme]
    default = "system"
    displayToggle = true
  [params.footer]
    enable = true
    displayCopyright = true
    displayPoweredBy = true
  [params.search]
    enable = true
    type = "flexsearch"
  [params.blog.list]
    displayTags = false

[languages]
  [languages.de]
    label = "Deutsch"
    locale = "de-DE"
    contentDir = "content/de"
    weight = 1
    copyright = "Inhalte unter [CC BY-SA 4.0](https://creativecommons.org/licenses/by-sa/4.0/deed.de), sofern nicht anders angegeben."
    [languages.de.params]
      description = "PauseAI Freiburg – Wir setzen uns für eine internationale Pause bei der Entwicklung der gefährlichsten KI-Systeme ein."

    [[languages.de.menus.main]]
      name = "Termine"
      pageRef = "/termine"
      weight = 10
    [[languages.de.menus.main]]
      name = "Blog"
      pageRef = "/blog"
      weight = 20
    [[languages.de.menus.main]]
      name = "FAQ"
      pageRef = "/faq"
      weight = 30
    [[languages.de.menus.main]]
      name = "Mitmachen"
      pageRef = "/mitmachen"
      weight = 40
    [[languages.de.menus.main]]
      name = "Suche"
      weight = 50
      [languages.de.menus.main.params]
        type = "search"

  [languages.en]
    label = "English"
    locale = "en-US"
    contentDir = "content/en"
    weight = 2
    copyright = "Content licensed under [CC BY-SA 4.0](https://creativecommons.org/licenses/by-sa/4.0/), unless otherwise marked."
    [languages.en.params]
      description = "PauseAI Freiburg – We campaign for an international pause on the development of the most dangerous AI systems."

    [[languages.en.menus.main]]
      name = "Events"
      pageRef = "/events"
      weight = 10
    [[languages.en.menus.main]]
      name = "Blog"
      pageRef = "/blog"
      weight = 20
    [[languages.en.menus.main]]
      name = "FAQ"
      pageRef = "/faq"
      weight = 30
    [[languages.en.menus.main]]
      name = "Get involved"
      pageRef = "/join"
      weight = 40
    [[languages.en.menus.main]]
      name = "Search"
      weight = 50
      [languages.en.menus.main.params]
        type = "search"
